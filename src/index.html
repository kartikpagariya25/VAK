<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Isla</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="island" class="collapsed">
    <div class="collapsed-view">
      <div class="eyes"><span></span><span></span></div>
      <div class="clock-mini" id="clockMini">--:--</div>
    </div>

    <div class="expanded-view">
      <header class="island-header">
        <span id="dateLabel"></span>
        <span id="timeLabel"></span>
        <button class="more-btn">&#8942;</button>
      </header>

      <main class="card-grid" id="cardGrid">
        <section class="card" data-module="chat-claude">
          <div class="card-label">Claude</div>
          <div class="card-body">Chat</div>
        </section>
        <section class="card" data-module="chat-gpt">
          <div class="card-label">ChatGPT</div>
          <div class="card-body">Chat</div>
        </section>
        <section class="card" data-module="fileshelf">
          <div class="card-label">File Shelf</div>
          <div class="card-body" id="shelfCount">Empty</div>
        </section>
        <section class="card" data-module="converter">
          <div class="card-label">Converter</div>
          <div class="card-body">Drop a file</div>
        </section>
      </main>

      <div class="panel" id="panel" hidden></div>

      <nav class="dock">
        <button data-module="home" class="active">Home</button>
        <button data-module="chat-claude">Claude</button>
        <button data-module="chat-gpt">GPT</button>
        <button data-module="fileshelf">Files</button>
        <button data-module="converter">Convert</button>
      </nav>
    </div>
  </div>

  <script src="renderer.js"></script>
  <script src="modules/clock.js"></script>
  <script src="modules/fileshelf.js"></script>
  <script src="modules/chat.js"></script>
  <script src="modules/converter.js"></script>
</body>
</html>
